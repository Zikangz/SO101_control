port: "/dev/ttyACM0"
backend: "mock"
id: "aerial_so101_3dof"
command_rate_hz: 100.0
publish_rate_hz: 50.0
feedback_read_rate_hz: 50.0
command_duration_s: 0.04
command_timeout_s: 1.0
stale_action: "hold_target"  # hold_target | freeze_current | estop
trajectory_hold_margin_s: 1.0
telemetry_rate_hz: 2.0
command_lpf_alpha: 1.0  # 1.0 disables LPF; try 0.8-0.95 only if commanded targets are noisy
command_deadband_rad: 0.0
trajectory_interpolation: "cubic"
skip_duplicate_writes: true
baudrate: 1000000
disable_torque_on_relax: true

servo_pid:
  default: {p: 16, i: 0, d: 32}
servo_speed: 800
servo_acceleration: 50

workspace_limits:
  x: [0.07, 0.45]
  y: [-0.25, 0.25]
  z: [0.00, 0.38]

joint_order:
  - shoulder_pan
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - wrist_roll
  - gripper

active_joints:
  - shoulder_lift
  - elbow_flex
  - gripper

locked_joints:
  shoulder_pan: 0.0
  wrist_flex: 0.0
  wrist_roll: 0.0

home_positions:
  shoulder_pan: 0.0
  shoulder_lift: 0.0
  elbow_flex: 0.0
  wrist_flex: 0.0
  wrist_roll: 0.0
  gripper: 0.5

limits:
  shoulder_pan: [-1.2, 1.2]
  shoulder_lift: [-1.0, 1.0]
  elbow_flex: [-1.2, 1.2]
  wrist_flex: [-0.8, 0.8]
  wrist_roll: [-1.0, 1.0]
  gripper: [0.0, 1.0]

max_velocity:
  shoulder_pan: 0.2
  shoulder_lift: 0.30
  elbow_flex: 0.35
  wrist_flex: 0.30
  wrist_roll: 0.2
  gripper: 0.5

motor_ids:
  shoulder_pan: 1
  shoulder_lift: 2
  elbow_flex: 3
  wrist_flex: 4
  wrist_roll: 5
  gripper: 6

hardware_calibration:
  shoulder_pan: {range_min: 0, range_max: 4095, homing_offset: 0, drive_mode: 0}
  shoulder_lift: {range_min: 0, range_max: 4095, homing_offset: 0, drive_mode: 0}
  elbow_flex: {range_min: 0, range_max: 4095, homing_offset: 0, drive_mode: 0}
  wrist_flex: {range_min: 0, range_max: 4095, homing_offset: 0, drive_mode: 0}
  wrist_roll: {range_min: 0, range_max: 4095, homing_offset: 0, drive_mode: 0}
  gripper: {range_min: 0, range_max: 4095, homing_offset: 0, drive_mode: 0}
