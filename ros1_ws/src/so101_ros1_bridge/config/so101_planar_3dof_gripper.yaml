# Planar SO101: 3 arm DOF in one vertical plane + 1 gripper DOF.
# Commanded arm joints: shoulder_lift, elbow_flex, wrist_flex.
# Locked spatial joints: shoulder_pan, wrist_roll.

port: "/dev/ttyACM0"
backend: "mock"
id: "aerial_so101_planar_3dof_gripper"
command_rate_hz: 100.0
publish_rate_hz: 50.0
feedback_read_rate_hz: 50.0
command_duration_s: 0.04
ik_tolerance_m: 0.002
ik_command_tolerance_m: 0.008
ik_max_iters: 200
command_timeout_s: 1.0
stale_action: "hold_target"  # hold_target | freeze_current | estop
trajectory_hold_margin_s: 1.0
telemetry_rate_hz: 2.0
command_lpf_alpha: 1.0  # 1.0 disables LPF; try 0.8-0.95 only if commanded targets are noisy
command_deadband_rad: 0.0
trajectory_interpolation: "cubic"
skip_duplicate_writes: true
baudrate: 1000000
disable_torque_on_relax: true

servo_pid:
  default: {p: 16, i: 0, d: 32}
servo_speed: 800
servo_acceleration: 50

# Real-time Cartesian servo (so101_servo_node.py). Drives the end effector in
# the x-z plane from either a Cartesian position target or an EE velocity
# command, streaming smoothed joint setpoints to /so101/command_joint_servo.
servo_rate_hz: 100.0
servo_input_timeout_s: 0.3          # drop position/velocity commands older than this
servo_joint_state_timeout_s: 0.5    # require fresh joint_states to stay active
servo_position_gain: 6.0            # proportional pull toward the Cartesian setpoint (1/s)
servo_max_ee_speed: 0.25            # cap on commanded EE speed in the x-z plane (m/s)
servo_ik_damping: 0.06              # DLS damping for the resolved-rate Jacobian
servo_accel_scale: 6.0              # joint max_acceleration = max_velocity * this
servo_jerk_scale: 12.0             # joint max_jerk = max_acceleration * this
servo_resync_gain: 0.0              # >0 slowly resyncs internal q_cmd to measured (1/s)
servo_prefer_ruckig: true           # use Ruckig online limiter when importable

workspace_limits:
  x: [0.07, 0.45]
  y: [-0.25, 0.25]
  z: [0.00, 0.38]

joint_order:
  - shoulder_pan
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - wrist_roll
  - gripper

active_joints:
  - shoulder_lift
  - elbow_flex
  - wrist_flex
  - gripper

locked_joints:
  shoulder_pan: 0.0
  wrist_roll: 0.0

home_positions:
  shoulder_pan: 0.0
  shoulder_lift: 0.0
  elbow_flex: 0.0
  wrist_flex: 0.0
  wrist_roll: 0.0
  gripper: 0.5

limits:
  shoulder_pan: [-1.2, 1.2]
  shoulder_lift: [-0.6, 0.6]
  elbow_flex: [-0.8, 0.9]
  wrist_flex: [-0.6, 0.6]
  wrist_roll: [-1.5, 1.5]
  gripper: [0.0, 1.0]

max_velocity:
  shoulder_pan: 0.2
  shoulder_lift: 0.50
  elbow_flex: 0.55
  wrist_flex: 0.60
  wrist_roll: 0.3
  gripper: 0.8

motor_ids:
  shoulder_pan: 1
  shoulder_lift: 2
  elbow_flex: 3
  wrist_flex: 4
  wrist_roll: 5
  gripper: 6

hardware_calibration:
  shoulder_pan: {range_min: 718, range_max: 3372, homing_offset: 2039, drive_mode: 0}
  shoulder_lift: {range_min: 910, range_max: 3307, homing_offset: 2100, drive_mode: 0}
  elbow_flex: {range_min: 890, range_max: 3084, homing_offset: 1999, drive_mode: 0}
  wrist_flex: {range_min: 923, range_max: 3261, homing_offset: 2092, drive_mode: 0}
  wrist_roll: {range_min: 151, range_max: 3943, homing_offset: 1990, drive_mode: 0}
  gripper: {range_min: 1402, range_max: 2904, homing_offset: 1944, drive_mode: 0}
